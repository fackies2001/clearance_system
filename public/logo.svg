<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="nbiGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="45%" stop-color="#d97706" />
            <stop offset="100%" stop-color="#92400e" />
        </linearGradient>

        <linearGradient id="nbiCreamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fffbeb" />
            <stop offset="100%" stop-color="#fef3c7" />
        </linearGradient>
    </defs>

    <!-- FINGERPRINT TOP ARCH RIDGES -->
    <g stroke="url(#nbiGoldGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
        <path d="M72 65 C80 50, 120 50, 128 65" stroke-dasharray="3 3" />
        <path d="M64 78 C75 58, 125 58, 136 78" />
        <path d="M58 90 C72 68, 128 68, 142 90" />
    </g>

    <!-- FINGERPRINT BOTTOM RIDGES -->
    <g stroke="url(#nbiGoldGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
        <path d="M75 145 C85 165, 115 165, 125 145" />
        <path d="M68 158 C82 180, 118 180, 132 158" />
        <path d="M78 172 C88 186, 112 186, 122 172" />
    </g>

    <!-- HORIZONTAL BALANCE BEAM -->
    <path d="M 35 75 C 50 68, 75 62, 100 62 C 125 62, 150 68, 165 75" fill="none" stroke="url(#nbiGoldGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- CENTER PILLAR & KEYHOLE OUTER BODY -->
    <path d="M 100 60 C 86 60, 80 75, 80 92 C 80 108, 86 116, 90 120 C 86 135, 82 145, 100 150 C 118 145, 114 135, 110 120 C 114 116, 120 108, 120 92 C 120 75, 114 60, 100 60 Z" fill="url(#nbiGoldGrad)" />

    <!-- INNER KEYHOLE CUTOUT -->
    <path d="M 100 80 A 9 9 0 1 0 100 98 A 9 9 0 0 0 100 80 Z M 95 94 L 105 94 L 108 128 L 92 128 Z" fill="#fdf8f0" />

    <!-- LEFT BALANCE RING & PAN -->
    <circle cx="35" cy="75" r="5" fill="none" stroke="url(#nbiGoldGrad)" stroke-width="3" />
    <path d="M 30 78 L 18 115 M 40 78 L 52 115" stroke="url(#nbiGoldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 14 115 L 56 115 Q 35 130 14 115 Z" fill="url(#nbiGoldGrad)" />

    <!-- RIGHT BALANCE RING & PAN -->
    <circle cx="165" cy="75" r="5" fill="none" stroke="url(#nbiGoldGrad)" stroke-width="3" />
    <path d="M 160 78 L 148 115 M 170 78 L 182 115" stroke="url(#nbiGoldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 144 115 L 186 115 Q 165 130 144 115 Z" fill="url(#nbiGoldGrad)" />
</svg>
